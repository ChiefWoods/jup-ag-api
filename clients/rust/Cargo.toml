[package]
name = "jup-ag-api"
version = "6.0.48"
edition = "2021"
license = "MIT"
description = "Jupiter API client"
repository = "https://github.com/jup-ag/jupiter-quote-api-node"
homepage = "https://github.com/jup-ag/jupiter-quote-api-node"

[dependencies]
jup-ag-api-generated = { path = "../../generated/rust", default-features = false }
reqwest = { version = "^0.13", default-features = false }

[features]
default = ["native-tls"]
native-tls = ["jup-ag-api-generated/native-tls", "reqwest/native-tls"]
rustls = ["jup-ag-api-generated/rustls", "reqwest/rustls"]
